server:
  port: 8081

spring:
  application:
    name: user-service

  # ?? PostgreSQL ??????????????????????????????????????????????????
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:job-recruitment-user-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # ?? JPA ?????????????????????????????????????????????????????????
  jpa:
    hibernate:
      ddl-auto: update        # use 'validate' once schema is stable
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Eureka — off until a discovery server exists (set EUREKA_CLIENT_ENABLED=true)
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# ?? JWT ?????????????????????????????????????????????????????????
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000     # 24 hours

# ?? Actuator ?????????????????????????????????????????????????????
management:
  endpoints:
    web:
      exposure:
        include: health,info

# ?? Swagger UI ????????????????????????????????????????????????????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs